backend:
  name: git-gateway
  branch: main

# Store uploaded images here — matches the paths used in profile.json / projects.json
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "profile"
    label: "Profile & Site Content"
    files:
      - file: "data/profile.json"
        label: "Profile"
        name: "profile"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Role / Title Line", name: "role", widget: "string" }
          - { label: "Hero Tagline", name: "tagline", widget: "string" }
          - { label: "Bio Paragraph", name: "bio", widget: "text" }
          - { label: "Profile Photo", name: "photo", widget: "image" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Location Line", name: "location", widget: "string" }
          - { label: "Fiverr Profile URL", name: "fiverrUrl", widget: "string" }
          - { label: "Years Experience", name: "yearsExperience", widget: "string" }
          - { label: "Fiverr Level", name: "fiverrLevel", widget: "string" }
          - label: "Stats (shown on homepage)"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list" }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author Name", name: "author", widget: "string" }
              - { label: "Author Role", name: "role", widget: "string" }
          - label: "Social Links"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Platform Name", name: "platform", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

  - name: "projects"
    label: "Portfolio Projects"
    files:
      - file: "data/projects.json"
        label: "Projects"
        name: "projects"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Website", "Video", "Podcast", "Reel", "Ad"]
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
              - { label: "Link (optional, live URL or video link)", name: "link", widget: "string", required: false }
              - { label: "Tags", name: "tags", widget: "list" }
